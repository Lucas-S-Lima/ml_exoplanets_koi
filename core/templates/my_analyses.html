{% extends "base.html" %}
{% block title %}Acessar — ExoClassify{% endblock %}
{% block body %}
<div class="min-h-screen relative flex flex-col items-center justify-center px-4 py-12 bg-[#060d1f]">

  <!-- Stars -->
  <div class="fixed inset-0 pointer-events-none z-0" id="stars-bg">
    <div class="absolute inset-0" style="background: radial-gradient(ellipse at 20% 50%, rgba(29,78,216,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(109,40,217,0.1) 0%, transparent 50%), #060d1f;"></div>
  </div>

  <div class="relative z-10 text-center mb-10">
    <h1 class="text-4xl font-black tracking-widest text-white font-orbitron">Acessar ExoClassify</h1>
    <p class="text-sm text-blue-400 mt-2 tracking-widest uppercase">Analysis and Classification of Exoplanets</p>
  </div>

  {% if error %}
  <div class="relative z-10 w-full max-w-2xl mb-4">
    <div class="bg-red-900/40 border border-red-600/50 text-red-300 text-sm px-4 py-3 rounded-lg">{{ error }}</div>
  </div>
  {% endif %}

  <div class="relative z-10 w-full max-w-2xl grid grid-cols-1 sm:grid-cols-2 gap-6">

    <!-- Login -->
    <form method="post" class="bg-[#0a1628]/90 backdrop-blur border border-[#1e3a5f] rounded-xl p-6">
      {% csrf_token %}
      <input type="hidden" name="action" value="login">
      <h2 class="text-sm font-bold tracking-widest uppercase text-blue-300 mb-5">Login</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Email</label>
          <input type="email" name="email" placeholder="you@example.com" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Senha</label>
          <input type="password" name="senha" placeholder="••••••••" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
      </div>
      <button type="submit" class="mt-6 w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-md transition-colors">
        Entrar
      </button>
      <button type="button" class="mt-2 w-full text-xs text-slate-500 hover:text-blue-400 transition-colors">
        Esqueceu a Senha?
      </button>
    </form>

    <!-- Register -->
    <form method="post" class="bg-[#0a1628]/90 backdrop-blur border border-[#1e3a5f] rounded-xl p-6">
      {% csrf_token %}
      <input type="hidden" name="action" value="register">
      <h2 class="text-sm font-bold tracking-widest uppercase text-blue-300 mb-5">Cadastrar</h2>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Nome</label>
          <input type="text" name="nome" placeholder="Ana Silva" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Email</label>
          <input type="email" name="reg_email" placeholder="you@example.com" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Senha</label>
          <input type="password" name="reg_senha" placeholder="••••••••" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider">Confirmação</label>
          <input type="password" name="reg_conf" placeholder="••••••••" class="w-full bg-[#0d1b35] border border-[#1e3a5f] rounded-md px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500/30 transition-colors">
        </div>
      </div>
      <button type="submit" class="mt-6 w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold rounded-md transition-colors">
        Criar Conta
      </button>
    </form>

  </div>
</div>

<script>
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    const size = Math.random() * 2 + 1;
    s.style.cssText = `position:absolute;border-radius:50%;background:#fff;width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${Math.random()*0.7+0.1}`;
    bg.appendChild(s);
  }
</script>
{% endblock %}
