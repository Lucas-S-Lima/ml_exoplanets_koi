{% extends "base.html" %}
{% block body %}
<div class="h-screen flex flex-col bg-[#060d1f] relative overflow-hidden">

  <!-- Stars background -->
  <div class="fixed inset-0 pointer-events-none z-0" id="stars-bg">
    <div class="absolute inset-0" style="background: radial-gradient(ellipse at 20% 50%, rgba(29,78,216,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(109,40,217,0.1) 0%, transparent 50%), #060d1f;"></div>
  </div>

  <!-- Topbar -->
  <header class="relative z-20 h-12 shrink-0 bg-[#070f20]/90 border-b border-[#1e3a5f]/60 flex items-center px-6 gap-6">
    <span class="text-sm font-bold tracking-widest text-blue-300 mr-4 font-orbitron">ExoClassify</span>
    <a href="{% url 'home' %}" class="text-xs {% if active == 'home' %}text-blue-300 border-b border-blue-400{% else %}text-slate-400 hover:text-blue-300{% endif %} transition-colors pb-0.5">Home</a>
    <a href="{% url 'new-analysis' %}" class="text-xs {% if active == 'new-analysis' %}text-blue-300 border-b border-blue-400{% else %}text-slate-400 hover:text-blue-300{% endif %} transition-colors pb-0.5">New Analysis</a>
    <a href="{% url 'my-analyses' %}" class="text-xs {% if active == 'my-analyses' %}text-blue-300 border-b border-blue-400{% else %}text-slate-400 hover:text-blue-300{% endif %} transition-colors pb-0.5">My Analyses</a>
    <span class="text-xs text-slate-400">Profile</span>
    <div class="ml-auto flex items-center gap-3">
      <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-xs font-bold text-white">A</div>
    </div>
  </header>

  <!-- Body -->
  <div class="relative z-10 flex flex-1 min-h-0">

    <!-- Sidebar -->
    <aside class="w-48 shrink-0 bg-[#070f20]/80 border-r border-[#1e3a5f]/60 flex flex-col">
      <div class="px-4 py-4 border-b border-[#1e3a5f]/60">
        <span class="text-sm font-bold tracking-widest text-blue-300 font-orbitron">ExoClassify</span>
      </div>
      <nav class="flex-1 py-3 px-2 space-y-0.5">
        {% with items=sidebar_items %}
        <a href="{% url 'home' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-all {% if active == 'home' %}bg-blue-600/20 text-blue-300 border border-blue-500/30{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
          <span class="w-4 text-center">⌂</span> Home
        </a>
        <a href="{% url 'new-analysis' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-all {% if active == 'new-analysis' %}bg-blue-600/20 text-blue-300 border border-blue-500/30{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
          <span class="w-4 text-center">+</span> New Analysis
        </a>
        <a href="{% url 'my-analyses' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm transition-all {% if active == 'my-analyses' %}bg-blue-600/20 text-blue-300 border border-blue-500/30{% else %}text-slate-400 hover:text-slate-200 hover:bg-white/5{% endif %}">
          <span class="w-4 text-center">☰</span> My Analyses
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm text-slate-400 hover:text-slate-200 hover:bg-white/5 transition-all">
          <span class="w-4 text-center">⚙</span> Settings
        </a>
        {% endwith %}
      </nav>
      <div class="px-2 pb-4">
        <a href="{% url 'logout' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm text-slate-500 hover:text-red-400 hover:bg-red-900/10 transition-all">
          <span class="w-4 text-center">→</span> Logout
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

<script>
  // Scatter stars
  const bg = document.getElementById('stars-bg');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    const size = Math.random() * 2 + 1;
    s.style.cssText = `position:absolute;border-radius:50%;background:#fff;width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;opacity:${Math.random()*0.7+0.1}`;
    bg.appendChild(s);
  }
</script>
{% endblock %}
